[project]
name = "ragmine"
version = "0.2.0"
description = "Mine your documents. Local-first RAG with pluggable everything."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mohan" }]
keywords = ["rag", "local", "mcp", "vector-search", "ollama", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# Core dependencies - required for basic functionality
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    # Core for embeddings & storage (most common setup)
    "lancedb>=0.15",
    "sentence-transformers>=3.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# Storage alternatives
store-chroma = ["chromadb>=0.5"]

# Parsing
parse = ["docling>=2.0"]

# Reranking
rerank = ["sentence-transformers>=3.0"]

# Server
serve = ["fastapi>=0.115", "uvicorn>=0.30"]

# MCP
mcp = ["mcp[cli]>=1.2"]

# TUI
tui = ["textual>=0.50"]

# Connectors
connector-web = ["html2text>=2020.1.16", "trafilatura>=1.0"]
connector-github = []
connector-confluence = []
connector-slack = []
connector-notion = ["notion-client>=2.0"]
connector-database = ["sqlalchemy>=2.0"]
connector-rss = ["feedparser>=6.0"]
connector-s3 = ["boto3>=1.0"]
connector-metabase = []

# All connectors
connectors = [
    "ragmine[connector-web,connector-github,connector-confluence,connector-slack,connector-notion,connector-database,connector-rss,connector-s3,connector-metabase]",
]

# Full install - everything
all = [
    "ragmine[store-chroma,parse,rerank,serve,mcp,tui,connectors]",
]

[project.scripts]
ragmine = "ragmine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragmine"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
